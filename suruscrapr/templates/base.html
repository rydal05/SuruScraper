<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SuruScraper{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SuruScraper</p>
          <h1 class="brand-title">H1 HEADER</h1>
        </div>
        <nav class="topnav">
          <a href="{{ url_for('wishlist.index') }}">Home</a>
          <a href="{{ url_for('wishlist.create') }}">Add</a>
          <a href="{{ url_for('wishlist.settings') }}">Settings</a>
          {% if g.user %}
          {% else %}
            <a href="{{ url_for('auth.register') }}">First-time Register</a>
            <a href="{{ url_for('auth.login') }}">Log In</a>
          {% endif %}
        </nav>
      </header>

      <main class="content">
        {% for message in get_flashed_messages() %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>

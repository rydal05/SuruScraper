{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
<section class="auth-panel">
	<div class="panel-copy">
		<p class="eyebrow">Access</p>
		<h2>Log in to manage your tracked items.</h2>
		<p>Use the account you created during first-time setup to add wishlist links, tune settings, and review the latest scrape state.</p>
		<a class="text-link" href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
	</div>
	<form method="post" class="card form-card">
		<label for="username">Username</label>
		<input name="username" id="username" required autocomplete="username">

		<label for="password">Password</label>
		<input type="password" name="password" id="password" required autocomplete="current-password">

		<button type="submit" class="button">Log In</button>
	</form>
</section>
{% endblock %}

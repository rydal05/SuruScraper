{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<section class="auth-panel">
	<div class="panel-copy">
		<p class="eyebrow">Recovery</p>
		<h2>Reset access without leaving the app.</h2>
		<p>The current flow generates a temporary password and shows it in the UI. You can later swap this for email delivery or a logging hook.</p>
	</div>
	<form method="post" class="card form-card">
		<label for="username">Username</label>
		<input name="username" id="username" required autocomplete="username">

		<button type="submit" class="button">Generate Temporary Password</button>
	</form>
</section>
{% endblock %}
